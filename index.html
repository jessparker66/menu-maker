<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Maker</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
    <h1>Perfect Patties Menu Maker</h1>
<form id="menu-form">
 <label for="menu-input">Paste your menu as JSON:</label>
<textarea id="menu-input" rows="8">[
    {"name": "Savory Patty", "price": 6.50},
    {"name": "Vegan Patty", "price": 7},
    {"name": "Spicy Patty", "price": 8},
    {"name": "Classic Patty", "price": 7.50}
]</textarea>
<button type="submit">Show my menu</button>
</form>

<p id="message"></p>
<ul id="menu-list"></ul>

    <script src="script.js" defer></script>
</body>
</html>
